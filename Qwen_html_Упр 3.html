<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Кодовая Академия — напиши нам!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-grad-1: #667eea; --bg-grad-2: #a78bfa; --bg-grad-3: #f093fb; --bg-grad-4: #feca57;
    --grid-color: rgba(255,255,255,.08);
    --card-bg: #fffdf7; --card-border: #2d2d2d; --card-shadow: #2d2d2d;
    --text-main: #2d2d2d; --text-sub: #5a5a5a;
    --input-bg: white; --input-hover: #fffbe6; --input-focus-bg: #f5f0ff;
    --input-focus-border: #a78bfa; --input-focus-ring: rgba(167,139,250,.3);
    --placeholder: #a8a8a8;
    --error: #ff4757; --error-bg: #fff0f2;
    --success-1: #55efc4; --success-2: #00b894; --success-bg: #f0fdf4;
    --check-bg: #fffbe6; --toggle-bg: #fffdf7;
    --title-shadow: #feca57; --code-bg: #2d2d2d; --code-color: #feca57;
  }
  [data-theme="dark"] {
    --bg-grad-1: #0f0c29; --bg-grad-2: #302b63; --bg-grad-3: #24243e; --bg-grad-4: #1a1a2e;
    --grid-color: rgba(255,255,255,.04);
    --card-bg: #1a1a2e; --card-border: #00f5ff; --card-shadow: #00f5ff;
    --text-main: #e8e8ff; --text-sub: #a0a0c0;
    --input-bg: #16213e; --input-hover: #1f2a4a; --input-focus-bg: #1f1f3a;
    --input-focus-border: #ff006e; --input-focus-ring: rgba(255,0,110,.3);
    --placeholder: #6a6a8a;
    --error: #ff6b8a; --error-bg: rgba(255,71,87,.15);
    --success-1: #00f5ff; --success-2: #00d9b8; --success-bg: rgba(0,245,255,.1);
    --check-bg: #16213e; --toggle-bg: #16213e;
    --title-shadow: #ff006e; --code-bg: #0f0c29; --code-color: #00f5ff;
  }

  body {
    font-family: 'Comic Sans MS', 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 35%, var(--bg-grad-3) 70%, var(--bg-grad-4) 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-x: hidden; position: relative;
    transition: background .6s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 30px 30px; pointer-events: none; z-index: 0;
  }

  /* ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ (справа вверху) ===== */
  .theme-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 100;
    width: 64px; height: 64px;
    border: 3px solid #2d2d2d; border-radius: 50%;
    background: var(--toggle-bg); cursor: pointer;
    box-shadow: 4px 4px 0 #2d2d2d;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s cubic-bezier(.4,0,.2,1);
  }
  .theme-toggle:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #2d2d2d; }
  .theme-toggle:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #2d2d2d; }
  .theme-toggle .icon { font-size: 30px; transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .theme-toggle.spin .icon { transform: rotate(360deg) scale(1.2); }
  .theme-toggle .label {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; color: var(--text-main);
    background: var(--card-bg); padding: 2px 8px; border-radius: 8px;
    border: 2px solid #2d2d2d; white-space: nowrap; opacity: 0;
    transition: opacity .2s; pointer-events: none;
  }
  .theme-toggle:hover .label { opacity: 1; }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .stars span {
    position: absolute; width: 4px; height: 4px;
    background: white; border-radius: 50%;
    box-shadow: 0 0 8px white, 0 0 14px #feca57;
    animation: twinkle 2.5s ease-in-out infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.3); } }

  .bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-decor svg, .bg-decor .emoji { position: absolute; filter: drop-shadow(3px 5px 0 rgba(0,0,0,.18)); }
  .bg-decor svg { animation: floatBg 12s ease-in-out infinite; }
  .bg-decor .emoji { font-size: 42px; animation: floatEmoji 10s ease-in-out infinite; }
  @keyframes floatBg { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-35px) rotate(15deg); } }
  @keyframes floatEmoji { 0%, 100% { transform: translateY(0) rotate(-10deg) scale(1); } 50% { transform: translateY(-40px) rotate(15deg) scale(1.15); } }
  .bg-decor .i1  { top: 5%;   left: 3%;   width: 80px; animation-delay: 0s; }
  .bg-decor .i2  { top: 12%;  right: 5%;  width: 90px; animation-delay: 2s; }
  .bg-decor .i3  { top: 35%;  left: 1%;   width: 70px; animation-delay: 4s; }
  .bg-decor .i4  { bottom: 15%; right: 3%; width: 85px; animation-delay: 1s; }
  .bg-decor .i5  { bottom: 6%; left: 6%;  width: 75px; animation-delay: 3s; }
  .bg-decor .i6  { top: 55%;  right: 2%;  width: 65px; animation-delay: 5s; }
  .bg-decor .i7  { top: 22%;  left: 42%;  width: 55px; animation-delay: 6s; }
  .bg-decor .i8  { bottom: 32%; left: 25%; width: 60px; animation-delay: 7s; }
  .bg-decor .i9  { top: 75%;  left: 50%;  width: 70px; animation-delay: 8s; }
  .bg-decor .i10 { top: 8%;   left: 22%;  width: 60px; animation-delay: 9s; }
  .bg-decor .i11 { bottom: 22%; right: 22%; width: 65px; animation-delay: 10s; }
  .bg-decor .e1 { top: 18%; left: 15%; animation-delay: 1.5s; }
  .bg-decor .e2 { top: 65%; right: 15%; animation-delay: 3.5s; }
  .bg-decor .e3 { bottom: 40%; left: 10%; animation-delay: 5.5s; }
  .bg-decor .e4 { top: 45%; right: 10%; animation-delay: 7.5s; }
  .bg-decor .e5 { bottom: 10%; left: 40%; animation-delay: 2.5s; }
  .bg-decor .e6 { top: 30%; right: 30%; animation-delay: 4.5s; }

  .code-stream { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .code-stream span {
    position: absolute; font-family: 'Courier New', monospace;
    font-size: 16px; font-weight: 900; color: white;
    text-shadow: 0 0 10px rgba(255,255,255,.8); opacity: 0;
    animation: streamUp linear infinite;
  }
  @keyframes streamUp { 0% { transform: translateY(110vh); opacity: 0; } 10% { opacity: .6; } 90% { opacity: .6; } 100% { transform: translateY(-40px); opacity: 0; } }

  .container { width: 100%; max-width: 560px; animation: slideIn .7s cubic-bezier(.2,.85,.25,1); position: relative; z-index: 1; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(40px) scale(.9) rotate(-3deg); } to { opacity: 1; transform: translateY(0) scale(1) rotate(0); } }

  .card {
    background: var(--card-bg); border: 4px solid var(--card-border);
    border-radius: 28px; padding: 36px 32px 32px;
    box-shadow: 10px 10px 0 var(--card-shadow), 0 20px 40px rgba(0,0,0,.22);
    position: relative; overflow: hidden;
    transition: background .6s ease, border-color .6s ease, box-shadow .6s ease;
  }
  .card::before {
    content: '⚡'; position: absolute; top: -20px; left: -20px;
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #feca57 0%, #ff9f43 100%);
    border: 3px solid #2d2d2d; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; box-shadow: 3px 3px 0 #2d2d2d;
    transform: rotate(-15deg); z-index: 2;
    animation: zap 1.6s ease-in-out infinite;
  }
  @keyframes zap { 0%, 100% { transform: rotate(-15deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-15deg) scale(1.15); filter: brightness(1.3); } }
  .card::after {
    content: '{ }'; position: absolute; top: -16px; right: -16px;
    width: 58px; height: 58px;
    background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
    border: 3px solid #2d2d2d; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: white;
    font-family: 'Courier New', monospace;
    box-shadow: 3px 3px 0 #2d2d2d; transform: rotate(15deg); z-index: 2;
    animation: spinSlow 10s linear infinite;
  }
  @keyframes spinSlow { to { transform: rotate(375deg); } }

  .mascot { display: flex; justify-content: center; margin-bottom: 14px; animation: mascotBob 3s ease-in-out infinite; position: relative; z-index: 1; }
  @keyframes mascotBob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
  .mascot .antenna-light { animation: antennaBlink 1.2s ease-in-out infinite; }
  @keyframes antennaBlink { 0%, 100% { fill: #ff6b6b; filter: drop-shadow(0 0 4px #ff6b6b); } 50% { fill: #feca57; filter: drop-shadow(0 0 10px #feca57); } }
  .mascot .eye { animation: blink 4s infinite; transform-origin: center; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  .header { text-align: center; margin-bottom: 22px; position: relative; z-index: 1; }
  .header h1 {
    font-size: 30px; color: var(--text-main); margin-bottom: 8px;
    text-shadow: 3px 3px 0 var(--title-shadow); letter-spacing: -.5px;
    animation: bounce .8s ease-out; transition: color .6s ease, text-shadow .6s ease;
  }
  @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } 60% { transform: translateY(-6px); } }
  .header p { color: var(--text-sub); font-size: 14.5px; font-weight: 600; transition: color .6s ease; }
  .header p code {
    font-family: 'Courier New', monospace; background: var(--code-bg);
    color: var(--code-color); padding: 2px 8px; border-radius: 5px; font-size: 13px;
    transition: background .6s ease, color .6s ease;
  }

  .success {
    display: none; align-items: center; gap: 14px; padding: 18px;
    background: linear-gradient(135deg, var(--success-1) 0%, var(--success-2) 100%);
    border: 3px solid #2d2d2d; border-radius: 16px; margin-bottom: 22px;
    box-shadow: 5px 5px 0 #2d2d2d; color: white; font-weight: 700;
    animation: okIn .5s cubic-bezier(.2,.85,.25,1); position: relative; z-index: 1;
  }
  .success.show { display: flex; }
  @keyframes okIn { from { opacity: 0; transform: translateY(-20px) scale(.9) rotate(-5deg); } to { opacity: 1; transform: translateY(0) scale(1) rotate(0); } }
  .success .ok-emoji { font-size: 36px; animation: rocket 1.5s ease-in-out infinite; }
  @keyframes rocket { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-8px) rotate(10deg); } }
  .success .ok-text { font-size: 15px; line-height: 1.4; text-shadow: 2px 2px 0 rgba(0,0,0,.15); }
  .success .ok-text b { display: block; font-size: 16px; }

  .form-group { margin-bottom: 22px; position: relative; z-index: 1; animation: fadeInUp .5s ease-out backwards; }
  .form-group:nth-child(1){animation-delay:.1s}
  .form-group:nth-child(2){animation-delay:.18s}
  .form-group:nth-child(3){animation-delay:.26s}
  .form-group:nth-child(4){animation-delay:.34s}
  .form-group:nth-child(5){animation-delay:.42s}
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  label.lbl {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; color: var(--text-main);
    margin-bottom: 8px; transition: color .6s ease;
  }
  .lbl .req { color: var(--error); }
  .lbl .ico-mini { width: 22px; height: 22px; flex-shrink: 0; }

  .input-wrap { position: relative; }
  .input-wrap .field-icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); width: 28px; height: 28px;
    pointer-events: none; z-index: 2; transition: transform .3s;
  }
  textarea ~ .field-icon { top: 18px; transform: none; }

  input[type="text"], input[type="tel"], textarea {
    width: 100%; padding: 14px 16px 14px 54px;
    font-size: 15px; font-family: inherit; font-weight: 600;
    border: 3px solid var(--card-border); border-radius: 14px;
    background: var(--input-bg); color: var(--text-main);
    box-shadow: 4px 4px 0 var(--card-shadow);
    transition: all .25s cubic-bezier(.4,0,.2,1); letter-spacing: .3px;
  }
  input::placeholder, textarea::placeholder { color: var(--placeholder); font-weight: 500; letter-spacing: .5px; }
  input:hover, textarea:hover {
    background: var(--input-hover); transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 var(--card-shadow);
  }
  input:focus, textarea:focus {
    outline: none; border-color: var(--input-focus-border);
    background: var(--input-focus-bg);
    box-shadow: 6px 6px 0 var(--card-shadow), 0 0 0 4px var(--input-focus-ring);
    transform: translate(-2px, -2px);
  }
  input:focus ~ .field-icon, textarea:focus ~ .field-icon { transform: translateY(-50%) scale(1.2) rotate(-15deg); }
  textarea:focus ~ .field-icon { transform: scale(1.2) rotate(-15deg); }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

  .checkbox-wrapper {
    display: flex; align-items: center; gap: 14px; cursor: pointer;
    padding: 14px 16px; border: 3px solid var(--card-border);
    border-radius: 14px; background: var(--input-bg);
    box-shadow: 4px 4px 0 var(--card-shadow); transition: all .25s; user-select: none;
  }
  .checkbox-wrapper:hover { background: var(--input-hover); transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--card-shadow); }
  .custom-check {
    width: 30px; height: 30px; border: 3px solid var(--card-border);
    border-radius: 9px; background: var(--check-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .25s; box-shadow: 2px 2px 0 var(--card-shadow);
  }
  .custom-check svg {
    width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 4;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .3s;
  }
  input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }
  input[type="checkbox"]:checked ~ .custom-check { background: linear-gradient(135deg, #55efc4 0%, #00b894 100%); transform: scale(1.12); }
  input[type="checkbox"]:checked ~ .custom-check svg { stroke-dashoffset: 0; }
  .checkbox-text { font-size: 14px; color: var(--text-main); font-weight: 600; line-height: 1.4; transition: color .6s ease; }

  .error-message {
    color: var(--error); font-size: 13px; font-weight: 700;
    margin-top: 0; max-height: 0; opacity: 0; overflow: hidden;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    display: flex; align-items: center; gap: 6px; padding-left: 4px;
  }
  .error-message.show { max-height: 60px; opacity: 1; margin-top: 8px; }
  .error-message::before { content: '🐛'; font-size: 14px; }
  .form-group.error input, .form-group.error textarea { border-color: var(--error); background: var(--error-bg); animation: shake .4s; }
  .form-group.error .checkbox-wrapper { border-color: var(--error); background: var(--error-bg); animation: shake .4s; }
  .form-group.error label.lbl { color: var(--error); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .form-group.valid input, .form-group.valid textarea { border-color: #00b894; background: var(--success-bg); }
  .form-group.valid .checkbox-wrapper { border-color: #00b894; background: var(--success-bg); }

  .submit-btn {
    width: 100%; padding: 16px; font-size: 18px; font-weight: 700; font-family: inherit;
    color: white; background: linear-gradient(135deg, #ff6b9d 0%, #a78bfa 50%, #48dbfb 100%);
    background-size: 200% 200%; border: 3px solid #2d2d2d; border-radius: 14px;
    cursor: pointer; transition: all .2s cubic-bezier(.4,0,.2,1);
    position: relative; z-index: 1; overflow: hidden; margin-top: 8px;
    box-shadow: 5px 5px 0 #2d2d2d; text-shadow: 2px 2px 0 rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    animation: gradientShift 4s ease infinite;
  }
  @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .submit-btn .btn-icon { width: 26px; height: 26px; transition: transform .3s; }
  .submit-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #2d2d2d; }
  .submit-btn:hover .btn-icon { transform: translateY(-4px) rotate(-15deg); animation: rocketLaunch .6s ease-in-out; }
  @keyframes rocketLaunch { 0% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-20deg); } 100% { transform: translateY(-4px) rotate(-15deg); } }
  .submit-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #2d2d2d; }

  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -20px; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(650px) rotate(720deg); opacity: 0; } }

  @media (max-width: 600px) {
    .card { padding: 32px 22px 26px; }
    .header h1 { font-size: 24px; }
    .bg-decor svg, .bg-decor .emoji { opacity: .75; }
    .theme-toggle { width: 54px; height: 54px; top: 14px; right: 14px; }
    .theme-toggle .icon { font-size: 24px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
  <span class="icon" id="themeIcon">🌙</span>
  <span class="label" id="themeLabel">Тёмная тема</span>
</button>

<div class="stars" id="stars"></div>
<div class="code-stream" id="codeStream"></div>

<div class="bg-decor">
  <svg class="i1" viewBox="0 0 100 80"><rect x="10" y="10" width="80" height="50" rx="5" fill="#2d2d2d" stroke="#2d2d2d" stroke-width="3"/><rect x="15" y="15" width="70" height="40" rx="2" fill="#48dbfb"/><text x="50" y="42" text-anchor="middle" font-family="Courier New" font-size="14" font-weight="900" fill="#2d2d2d">&lt;/&gt;</text><rect x="5" y="62" width="90" height="8" rx="3" fill="#576574" stroke="#2d2d2d" stroke-width="3"/></svg>
  <svg class="i2" viewBox="0 0 80 120"><path d="M40,10 Q55,35 55,70 L25,70 Q25,35 40,10 Z" fill="#ff6b9d" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round"/><circle cx="40" cy="45" r="9" fill="#48dbfb" stroke="#2d2d2d" stroke-width="3"/><circle cx="40" cy="45" r="4" fill="white"/><path d="M25,70 L15,90 L30,80 Z" fill="#feca57" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round"/><path d="M55,70 L65,90 L50,80 Z" fill="#feca57" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round"/><path d="M32,80 Q40,110 48,80 Q44,100 40,110 Q36,100 32,80 Z" fill="#ff9f43" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round"/></svg>
  <svg class="i3" viewBox="0 0 80 80"><g fill="#a78bfa" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round"><path d="M40,10 L46,10 L48,18 L56,20 L62,14 L68,20 L62,26 L64,34 L72,36 L72,44 L64,46 L62,54 L68,60 L62,66 L56,60 L48,62 L46,70 L34,70 L32,62 L24,60 L18,66 L12,60 L18,54 L16,46 L8,44 L8,36 L16,34 L18,26 L12,20 L18,14 L24,20 L32,18 L34,10 Z"/><circle cx="40" cy="40" r="12" fill="#fffdf7"/></g></svg>
  <svg class="i4" viewBox="0 0 120 70"><path d="M15,20 Q15,10 25,10 L95,10 Q105,10 105,20 L110,50 Q110,60 100,60 L85,60 L80,50 L40,50 L35,60 L20,60 Q10,60 10,50 Z" fill="#ff6b9d" stroke="#2d2d2d" stroke-width="3" stroke-linejoin="round"/><circle cx="35" cy="30" r="6" fill="#2d2d2d"/><circle cx="85" cy="25" r="5" fill="#feca57" stroke="#2d2d2d" stroke-width="2"/><circle cx="95" cy="35" r="5" fill="#48dbfb" stroke="#2d2d2d" stroke-width="2"/></svg>
  <svg class="i5" viewBox="0 0 80 80"><rect x="10" y="10" width="60" height="60" rx="4" fill="#576574" stroke="#2d2d2d" stroke-width="3"/><rect x="20" y="10" width="35" height="20" fill="#c8d6e5" stroke="#2d2d2d" stroke-width="3"/><rect x="25" y="15" width="6" height="12" fill="#2d2d2d"/><rect x="18" y="45" width="44" height="25" rx="2" fill="white" stroke="#2d2d2d" stroke-width="3"/><line x1="22" y1="52" x2="58" y2="52" stroke="#a78bfa" stroke-width="2"/><line x1="22" y1="58" x2="58" y2="58" stroke="#a78bfa" stroke-width="2"/><line x1="22" y1="64" x2="58" y2="64" stroke="#a78bfa" stroke-width="2"/></svg>

<script>
  // ===== Мигающие звёзды =====
  const starsBox = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 2.5) + 's';
    s.style.width = s.style.height = (2 + Math.random() * 4) + 'px';
    starsBox.appendChild(s);
  }

  // ===== Движущиеся "биты" кода =====
  const codeStream = document.getElementById('codeStream');
  const glyphs = ['{', '}', '<', '>', '/', ';', '=', '0', '1', '#', '$', 'fn', 'if', '=>', '::', '&&', '||'];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (10 + Math.random() * 15) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    s.style.fontSize = (12 + Math.random() * 10) + 'px';
    s.style.color = ['#fff', '#feca57', '#ff6b9d', '#55efc4', '#48dbfb'][Math.floor(Math.random() * 5)];
    codeStream.appendChild(s);
  }

  // ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ =====
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');
  const html = document.documentElement;

  const savedTheme = localStorage.getItem('theme') || 'light';
  applyTheme(savedTheme);

  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    if (theme === 'dark') {
      themeIcon.textContent = '☀️';
      themeLabel.textContent = 'Светлая тема';
    } else {
      themeIcon.textContent = '🌙';
      themeLabel.textContent = 'Тёмная тема';
    }
  }

  themeToggle.addEventListener('click', () => {
    const current = html.getAttribute('data-theme') || 'light';
    const next = current === 'light' ? 'dark' : 'light';
    themeToggle.classList.add('spin');
    setTimeout(() => themeToggle.classList.remove('spin'), 500);
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  // ===== МАСКА ТЕЛЕФОНА: +(375)XX-XXX-XX-XX =====
  const phoneInput = document.getElementById('phone');

  function formatPhone(digits) {
    // Оставляем только цифры, максимум 12 (375 + 9 цифр номера)
    digits = digits.replace(/\D/g, '').slice(0, 12);

    // Если начинается с 80 — заменяем на 375 (для удобства)
    if (digits.startsWith('80')) digits = '375' + digits.slice(2);
    // Если не начинается с 375 — добавляем код страны
    if (digits.length > 0 && !digits.startsWith('375')) {
      digits = '375' + digits;
    }
    digits = digits.slice(0, 12);

    if (digits.length === 0) return '';

    let f = '+';

    // +(XXX)
    if (digits.length <= 3) {
      f += '(' + digits;
      return f;
    }
    f += '(' + digits.slice(0, 3) + ')';

    // +(XXX)XX
    if (digits.length <= 5) {
      f += digits.slice(3);
      return f;
    }
    f += digits.slice(3, 5);

    // +(XXX)XX-XXX
    if (digits.length <= 8) {
      f += '-' + digits.slice(5);
      return f;
    }
    f += '-' + digits.slice(5, 8);

    // +(XXX)XX-XXX-XX
    if (digits.length <= 10) {
      f += '-' + digits.slice(8);
      return f;
    }
    f += '-' + digits.slice(8, 10);

    // +(XXX)XX-XXX-XX-XX
    f += '-' + digits.slice(10);
    return f;
  }

  phoneInput.addEventListener('input', function() {
    const raw = this.value.replace(/\D/g, '');
    this.value = formatPhone(raw);
    // Живая валидация
    if (raw.length === 12) hideError(this, phoneError);
  });

  phoneInput.addEventListener('focus', function() {
    if (!this.value) this.value = '+';
  });

  phoneInput.addEventListener('blur', function() {
    if (this.value === '+' || this.value === '+(') this.value = '';
  });

  phoneInput.addEventListener('keydown', function(e) {
    if (['Backspace','Delete','Tab','Escape','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
    if (!/^\d$/.test(e.key)) e.preventDefault();
  });

  // ===== Элементы формы =====
  const form = document.getElementById('contactForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const messageInput = document.getElementById('message');
  const agreeCheckbox = document.getElementById('agree');
  const successMessage = document.getElementById('successMessage');
  const confettiBox = document.getElementById('confetti');

  const nameError = document.getElementById('nameError');
  const emailError = document.getElementById('emailError');
  const phoneError = document.getElementById('phoneError');
  const messageError = document.getElementById('messageError');
  const agreeError = document.getElementById('agreeError');

  function validateName() {
    const value = nameInput.value.trim();
    if (!value) { showError(nameInput, nameError, 'Пожалуйста, введи своё имя, юный кодер!'); return false; }
    if (/^\d+$/.test(value)) { showError(nameInput, nameError, 'Имя не может состоять только из цифр. Добавь буквы!'); return false; }
    if (/[@№#%&]/.test(value)) { showError(nameInput, nameError, 'Имя не должно содержать спецсимволы: @, №, #, %, &'); return false; }
    hideError(nameInput, nameError);
    return true;
  }

  function validateEmail() {
    const value = emailInput.value.trim();
    if (!value) { showError(emailInput, emailError, 'Введи свой email — это как почтовый ящик для писем!'); return false; }
    if (value.startsWith('@')) { showError(emailInput, emailError, 'Email не может начинаться с символа @. Добавь имя перед ним!'); return false; }
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(value)) { showError(emailInput, emailError, 'Неверный формат email. Пример: name@mail.ru'); return false; }
    hideError(emailInput, emailError);
    return true;
  }

  function validatePhone() {
    const raw = phoneInput.value.replace(/\D/g, '');
    if (!raw) { showError(phoneInput, phoneError, 'Введи свой номер телефона — чтобы мы могли связаться!'); return false; }
    if (!raw.startsWith('375')) { showError(phoneInput, phoneError, 'Номер должен начинаться с кода страны 375'); return false; }
    if (raw.length !== 12) { showError(phoneInput, phoneError, 'Номер неполный (' + raw.length + ' из 12 цифр). Формат: +(375)XX-XXX-XX-XX'); return false; }
    hideError(phoneInput, phoneError);
    return true;
  }

  function validateMessage() {
    const value = messageInput.value.trim();
    if (!value) { showError(messageInput, messageError, 'Напиши своё сообщение — оно важно!'); return false; }
    if (value.length < 10) { showError(messageInput, messageError, 'Слишком коротко (' + value.length + ' символов). Минимум 10 символов!'); return false; }
    hideError(messageInput, messageError);
    return true;
  }

  function validateAgree() {
    if (!agreeCheckbox.checked) { showError(agreeCheckbox, agreeError, 'Нужно согласие на обработку данных — поставь галочку!'); return false; }
    hideError(agreeCheckbox, agreeError);
    return true;
  }

  function showError(input, errorElement, message) {
    input.closest('.form-group').classList.add('error');
    input.closest('.form-group').classList.remove('valid');
    errorElement.textContent = message;
    errorElement.classList.add('show');
  }

  function hideError(input, errorElement) {
    input.closest('.form-group').classList.remove('error');
    input.closest('.form-group').classList.add('valid');
    errorElement.textContent = '';
    errorElement.classList.remove('show');
  }

  // ===== IT-конфетти =====
  function confetti() {
    const emojis = ['🚀', '💻', '⚡', '✨', '🎮', '🤖', '🎯', '💾', '🔌', '⭐', '🌟', '💡'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('i');
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      p.style.fontSize = (20 + Math.random() * 18) + 'px';
      confettiBox.appendChild(p);
      setTimeout(() => p.remove(), 3500);
    }
  }

  // ===== Живая валидация =====
  nameInput.addEventListener('input', function() {
    const value = this.value.trim();
    if (value && !/^\d+$/.test(value) && !/[@№#%&]/.test(value)) hideError(this, nameError);
  });

  emailInput.addEventListener('input', function() {
    const value = this.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (value && !value.startsWith('@') && emailRegex.test(value)) hideError(this, emailError);
  });

  messageInput.addEventListener('input', function() {
    if (this.value.trim().length >= 10) hideError(this, messageError);
  });

  agreeCheckbox.addEventListener('change', function() {
    if (this.checked) hideError(this, agreeError);
  });

  // ===== Отправка =====
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const isNameValid = validateName();
    const isEmailValid = validateEmail();
    const isPhoneValid = validatePhone();
    const isMessageValid = validateMessage();
    const isAgreeValid = validateAgree();

    if (isNameValid && isEmailValid && isPhoneValid && isMessageValid && isAgreeValid) {
      successMessage.classList.add('show');
      confetti();
      setTimeout(() => {
        form.reset();
        document.querySelectorAll('.form-group').forEach(group => {
          group.classList.remove('valid', 'error');
        });
        setTimeout(() => { successMessage.classList.remove('show'); }, 3500);
      }, 500);
    }
  });
</script>
</body>
</html>
